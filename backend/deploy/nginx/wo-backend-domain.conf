# Wo backend — 备案域名 + Let's Encrypt，供微信小程序使用。
#
# 为什么需要独立一块：
#   微信小程序只认「已备案域名 + 受信任 CA 签发的证书」，既不接受裸 IP 也不接受
#   自签证书（TLS 握手直接失败）。而现有 App 打的是裸 IP + 自签 CA 并做了证书
#   绑定，不能动 —— 所以两块并存，各自用自己的证书，代理到同一个 upstream。
#
# 好消息：App 的 WoHttpOverrides 是 `withTrustedRoots: true`（同时信任系统公共根
# 和自签 CA），所以这里换成公共证书 **不会影响现有 App**，老 APK 照常连裸 IP。
#
# 与 wo-backend.conf 的关系：
#   wo-backend.conf        listen 443 ssl default_server; server_name _;   ← App
#   本文件                 listen 443 ssl;               server_name 域名; ← 小程序
# `default_server` 只在前者，故按 host 精确匹配域名、其余（含裸 IP）落到前者。
#
# 安装：
#   1. 先把 snippets/wo-backend-locations.conf 放到 /etc/nginx/snippets/
#   2. 把本文件放到 /etc/nginx/sites-available/wo-backend-domain 并软链到
#      sites-enabled/
#   3. nginx -t && systemctl reload nginx
#
# ⚠️ 为什么放 sites-enabled 而不是 conf.d：
#   nginx.conf 里 `include conf.d/*.conf` 在 `include sites-enabled/*` **之前**，
#   而 `upstream wo_backend` 定义在 sites-enabled/wo-backend 里。本文件若放
#   conf.d，解析到 `proxy_pass http://wo_backend` 时 upstream 还没定义，
#   nginx -t 直接报 "host not found in upstream"。
#   sites-enabled 内按文件名排序，"wo-backend" < "wo-backend-domain"，顺序正确。
#
# ⚠️ 启动顺序：证书签发前本块会因证书文件不存在导致 nginx -t 失败。
#    先跑 backend/deploy/tls/setup-letsencrypt.sh 拿到证书，再启用本文件。

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name wo.chunyi-work.online;

    # Let's Encrypt（certbot --webroot，见 ../tls/setup-letsencrypt.sh）。
    # 国内服务器若 80 端口被运营商封禁导致 HTTP-01 验证失败，改用 DNS-01：
    # certbot certonly --manual --preferred-challenges dns -d wo.chunyi-work.online
    ssl_certificate     /etc/letsencrypt/live/wo.chunyi-work.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wo.chunyi-work.online/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Body/timeout 上限在共享 snippet 里按 location 细分（回忆视频 110M、APK 200M）。
    include /etc/nginx/snippets/wo-backend-locations.conf;
}
