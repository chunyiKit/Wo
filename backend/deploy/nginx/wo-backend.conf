# Wo backend reverse proxy.
# TLS-terminating: nginx serves HTTPS on 443 with a self-signed cert (our own
# CA — see backend/deploy/tls/). The app trusts that CA explicitly, so this is
# effectively certificate pinning. Plain :80 only 301-redirects to https.
#
# Certs are installed by backend/deploy/tls/install-on-server.sh at:
#   /etc/wo/tls/server.crt  /etc/wo/tls/server.key

upstream wo_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# ---- Plain HTTP: upgrade everything to HTTPS --------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME HTTP-01 challenge for Let's Encrypt (certbot --webroot, see
    # ../tls/setup-letsencrypt.sh). Webroot matches the one already on the box
    # (used by the trek site), so certbot renews both from the same place.
    #
    # ⚠️ 为什么 301 必须写在 location 里而不是 server 级：
    # server 级 `return` 在 SERVER_REWRITE 阶段执行，**先于** location 匹配
    # （FIND_CONFIG 阶段）。写成 server 级 `return 301` 时，这里的 ACME
    # location 永远命中不了，验证请求会被 301 走 —— 签发和续期都会失败。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # 301 so clients (and caches) remember to use https next time. The app
    # talks https directly and never hits this; old plaintext clients get
    # bounced — which is the point of the cutover.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: the real server -------------------------------------------------
server {
    # Inline `http2` keyword for nginx < 1.25.1 (the box runs 1.18). Newer nginx
    # prefers a separate `http2 on;` but still accepts this with a warning.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    # Catch-all server_name so we work via raw IP. Requests that match a named
    # server block (see wo-backend-domain.conf, which serves the mini program
    # over a real domain + Let's Encrypt cert) never land here.
    server_name _;

    ssl_certificate     /etc/wo/tls/server.crt;
    ssl_certificate_key /etc/wo/tls/server.key;
    # Modern only — the sole client is our own app, no legacy handshakes needed.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Photo uploads can be up to 20 MB; allow some headroom for multipart
    # overhead. Bump this together with backend `MAX_UPLOAD_BYTES`.
    client_max_body_size 25M;

    # Slow client tolerance — long enough for mobile networks, not so long
    # that a stuck connection ties up a worker forever.
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # Shared with the domain server block — keep proxy behaviour identical for
    # the app (raw IP + pinned CA) and the mini program (domain + Let's Encrypt).
    include /etc/nginx/snippets/wo-backend-locations.conf;
}
